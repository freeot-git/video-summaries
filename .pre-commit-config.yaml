minimum_pre_commit_version: "4.6.2"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-illegal-windows-names
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: no-commit-to-branch

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Unpinned, pre-commit builds it with whatever Go is newest.
        language_version: "1.27.2"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen --only-group typecheck mypy
        language: system
        types: [python]
        require_serial: true
      - id: suppression-names-reason
        name: a suppression names its reason
        language: pygrep
        entry: '#\s*(noqa|type:\s*ignore|pyright:\s*ignore)(\[[^\]]*\]|:\s*[A-Z][A-Z0-9]*(,\s*[A-Z][A-Z0-9]*)*)?\s*$'
        types: [python]
      - id: psscriptanalyzer
        name: PSScriptAnalyzer
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File tools/pssa.ps1
        language: system
        files: \.ps1$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--offline]

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.3
    hooks:
      - id: typos
