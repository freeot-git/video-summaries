name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # Windows, so the PowerShell checks run in Windows PowerShell 5.1, which the scripts target.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"

      - name: Install PSScriptAnalyzer for Windows PowerShell
        shell: powershell
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run the hooks on the files this PR changes
        env:
          # Both are about commits; gitleaks gets its own step below.
          SKIP: gitleaks,no-commit-to-branch
          BASE_REF: ${{ github.base_ref }}
        run: >-
          uvx pre-commit@4.6.2 run --show-diff-on-failure
          --from-ref "origin/$env:BASE_REF" --to-ref HEAD

      - name: Scan this PR's commits for secrets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          $zip = "gitleaks_8.30.1_windows_x64.zip"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$zip"
          Invoke-WebRequest $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e") {
            throw "The gitleaks download doesn't match its published checksum."
          }
          Expand-Archive $zip -DestinationPath gitleaks
          ./gitleaks/gitleaks.exe git --redact --no-banner --log-opts="origin/$env:BASE_REF..HEAD" .

      - name: Check the workflows, including for known vulnerable actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 .github/workflows
